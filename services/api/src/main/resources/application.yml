server:
  port: ${API_PORT:8080}

spring:
  application:
    name: bizsage-api
  profiles:
    active: ${BIZSAGE_PROFILE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/bizsage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:bizsage}
    password: ${DB_PASSWORD:bizsage}
  flyway:
    enabled: ${BIZSAGE_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/mysql
    validate-on-migrate: true
  sql:
    init:
      mode: never
  # V2: Redis cache (Lettuce client)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

bizsage:
  diagnosis:
    completeness-threshold: ${DIAGNOSIS_COMPLETENESS_THRESHOLD:80}
  jwt:
    secret: ${JWT_SECRET}
  privacy:
    key: ${DATA_ENCRYPTION_KEY}
  gray-release:
    cohort: ${GRAY_RELEASE_COHORT:internal-operators-and-seed-paid-users}
    support-window: ${GRAY_RELEASE_SUPPORT_WINDOW:09:00-21:00 Asia/Shanghai}
    # V2: Per-feature gray-release flags
    features:
      pdf-export:
        enabled: true
        traffic-percent: 10
        allowed-memberships:
          - SEED_PAID
          - INTERNAL
      advanced-rag:
        enabled: false
        traffic-percent: 0
        allowed-memberships: []
  # V2: Alert evaluation thresholds
  alerts:
    api-error-rate-threshold: 0.05
    knowledge-staleness-days: 30
    evaluation-interval-seconds: 60
  memory:
    vector-sync-enabled: ${MEMORY_VECTOR_SYNC_ENABLED:false}
  # V2: SLA window configuration
  sla:
    aggregation-window-minutes: 1
    retention-days: 90

# V2: Expose Prometheus metrics and health endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: bizsage-api

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:bizsage_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: never

bizsage:
  jwt:
    secret: test-jwt-secret-0123456789abcdef
  privacy:
    key: 12345678901234567890123456789012
  gray-release:
    cohort: test-internal

---
spring:
  config:
    activate:
      on-profile: staging

bizsage:
  gray-release:
    cohort: staging-internal-and-seed-paid

---
spring:
  config:
    activate:
      on-profile: prod-gray

bizsage:
  gray-release:
    cohort: internal-operators-and-seed-paid-users
