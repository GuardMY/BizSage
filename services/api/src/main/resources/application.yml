server:
  port: ${API_PORT:8080}

spring:
  application:
    name: bizsage-api
  profiles:
    active: ${BIZSAGE_PROFILE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/bizsage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:bizsage}
    password: ${DB_PASSWORD:bizsage}
  sql:
    init:
      mode: never

bizsage:
  jwt:
    secret: ${JWT_SECRET:change-me-v1-dev-secret-change-me}
  privacy:
    key: ${DATA_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
  gray-release:
    cohort: ${GRAY_RELEASE_COHORT:internal-operators-and-seed-paid-users}
    support-window: ${GRAY_RELEASE_SUPPORT_WINDOW:09:00-21:00 Asia/Shanghai}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:bizsage_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

bizsage:
  gray-release:
    cohort: test-internal

---
spring:
  config:
    activate:
      on-profile: staging

bizsage:
  gray-release:
    cohort: staging-internal-and-seed-paid

---
spring:
  config:
    activate:
      on-profile: prod-gray

bizsage:
  gray-release:
    cohort: internal-operators-and-seed-paid-users
