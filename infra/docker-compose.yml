name: bizsage

# ── Infrastructure ─────────────────────────────────────────
services:
  mysql:
    image: mysql:8.0.45-bookworm
    container_name: bizsage-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bizsage
      MYSQL_USER: bizsage
      MYSQL_PASSWORD: bizsage
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubizsage", "-pbizsage"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2.12-alpine
    container_name: bizsage-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18
    container_name: bizsage-qdrant
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

# ── Application Services ───────────────────────────────────
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: bizsage-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bizsage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: bizsage
      DB_PASSWORD: bizsage
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-v1-dev-secret-change-me
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      AI_WORKER_URL: http://ai-worker:8100
      BIZSAGE_PROFILE: dev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-worker:
    build:
      context: ../services/ai-worker
      dockerfile: Dockerfile
    container_name: bizsage-ai-worker
    ports:
      - "8100:8100"
    environment:
      LLM_PROVIDER: mock
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ../services/ai-worker/app:/app/app
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  collector:
    build:
      context: ../services/collector
      dockerfile: Dockerfile
    container_name: bizsage-collector
    ports:
      - "8200:8200"
    environment:
      API_URL: http://api:8080
    volumes:
      - ../services/collector/app:/app/app
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: bizsage-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: unless-stopped

# ── Named Volumes ──────────────────────────────────────────
volumes:
  mysql_data:
  qdrant_data:
