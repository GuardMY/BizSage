name: bizsage

# Production deployment:
#   docker compose up -d
# Prerequisite:
#   Copy ../.env.example to .env and fill in real values.
#
# This compose file only deploys BizSage-owned services and nginx. Middleware
# such as MySQL, Redis, and Qdrant must be deployed separately and exposed
# through the environment variables used below.

services:
  # Application services
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: bizsage-api
    # API is exposed through nginx only.
    # ports:
    #   - "${API_PORT:-8080}:8080"
    environment:
      BIZSAGE_PROFILE: prod
      DB_URL: "${DB_URL}"
      DB_USERNAME: ${MYSQL_USER:-bizsage}
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      BIZSAGE_FLYWAY_ENABLED: "${BIZSAGE_FLYWAY_ENABLED:-false}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      JWT_SECRET: "${JWT_SECRET}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY}"
      AI_WORKER_URL: http://ai-worker:8100
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  ai-worker:
    build:
      context: ../services/ai-worker
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: bizsage-ai-worker
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER}"
      OPENAI_COMPATIBLE_BASE_URL: "${OPENAI_COMPATIBLE_BASE_URL}"
      OPENAI_COMPATIBLE_API_KEY: "${OPENAI_COMPATIBLE_API_KEY}"
      OPENAI_COMPATIBLE_MODEL: "${OPENAI_COMPATIBLE_MODEL}"
      QDRANT_URL: "${QDRANT_URL}"
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2'
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  collector:
    build:
      context: ../services/collector
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: bizsage-collector
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL}"
    container_name: bizsage-web
    # Web is exposed through nginx only.
    # ports:
    #   - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL}"
    depends_on:
      api:
        condition: service_healthy
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Reverse proxy
  nginx:
    image: nginx:1.29.4-alpine3.23
    container_name: bizsage-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  bizsage:
    driver: bridge
