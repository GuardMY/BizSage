name: bizsage

# ═══════════════════════════════════════════════════════════
# 生产部署：docker compose up -d
# 前置：cp ../.env.example .env 并填入真实值
# ═══════════════════════════════════════════════════════════

services:
  # ── Infrastructure ──────────────────────────────────────
  mysql:
    image: mysql:8.0.45-bookworm
    container_name: bizsage-mysql
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bizsage}
      MYSQL_USER: ${MYSQL_USER:-bizsage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u${MYSQL_USER:-bizsage}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
        reservations:
          memory: 256m

  redis:
    image: redis:7.2.12-alpine
    container_name: bizsage-redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  qdrant:
    image: qdrant/qdrant:v1.18
    container_name: bizsage-qdrant
    ports:
      - "${QDRANT_PORT:-16333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
        reservations:
          memory: 256m

  # ── Application Services ────────────────────────────────
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: bizsage-api
    # 不对外暴露端口 — 统一通过 nginx 反向代理访问
    # ports:
    #   - "${API_PORT:-8080}:8080"
    environment:
      BIZSAGE_PROFILE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bizsage}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-bizsage}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      BIZSAGE_FLYWAY_ENABLED: ${BIZSAGE_FLYWAY_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      AI_WORKER_URL: http://ai-worker:8100
      COLLECTOR_URL: http://collector:8200
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  ai-worker:
    build:
      context: ../services/ai-worker
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: bizsage-ai-worker
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2'
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  collector:
    build:
      context: ../services/collector
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: bizsage-collector
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: bizsage-web
    # 不对外暴露端口 — 统一通过 nginx 反向代理访问
    # ports:
    #   - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:1.29.4-alpine3.23
    container_name: bizsage-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: always
    networks:
      - bizsage
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# ── Networks ─────────────────────────────────────────────
networks:
  bizsage:
    driver: bridge

# ── Named Volumes ────────────────────────────────────────
volumes:
  mysql_data:
  qdrant_data:
